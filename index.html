<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4FD8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tindahan">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Tindahan Manager</title>
<style>
:root{
  --bg:#F1F4FA; --surface:#FFFFFF; --ink:#10203A; --muted:#5D6B85; --line:#DDE3EF;
  --primary:#1F4FD8; --on-primary:#FFFFFF; --tag:#FFC61A; --on-tag:#1B1400;
  --ok:#17804A; --ok-bg:#DDF3E7; --warn:#9A5B00; --warn-bg:#FFEBC2; --bad:#C6281E; --bad-bg:#FDE0DD;
  --shadow:0 1px 2px rgba(16,32,58,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1524; --surface:#16213A; --ink:#E9EEF8; --muted:#9AA6BD; --line:#26344F;
    --primary:#7B97FF; --on-primary:#0B1330;
    --ok:#4CD08B; --ok-bg:#12352A; --warn:#F5B84D; --warn-bg:#3A2C10; --bad:#FF7E74; --bad-bg:#3C1B1A;
    --shadow:none;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;
}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
[hidden]{display:none !important}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:88px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.top small{display:block;color:var(--muted);font-size:.8rem;font-weight:500;margin-top:2px}
.top small.offline{color:var(--bad);font-weight:700}
.who{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:.85rem;font-weight:600;min-height:40px;max-width:46vw}
.who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.who.staff .dot{background:var(--tag)}

main{padding:4px 16px 16px}
.section-title{margin:22px 0 8px;font-size:1.05rem;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.link{color:var(--primary);font-size:.9rem;font-weight:600;background:none;padding:6px 0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.notice{padding:12px 14px;margin-bottom:12px;background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.notice button{color:inherit;text-decoration:underline;font-weight:700;flex:none;padding:6px 0}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:12px 14px;text-align:left;width:100%}
.stat b{display:block;font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat span{color:var(--muted);font-size:.85rem}
.stat.wide{grid-column:span 2;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.wide span{color:inherit;opacity:.75}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}

.tag{display:inline-block;background:var(--tag);color:var(--on-tag);font-weight:800;font-size:1.02rem;padding:3px 10px 3px 18px;
  clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);white-space:nowrap;letter-spacing:-.01em}
.tag.big{font-size:1.35rem;padding:4px 12px 4px 22px;clip-path:polygon(15px 0,100% 0,100% 100%,15px 100%,0 50%)}

.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.low{background:var(--warn-bg);color:var(--warn)}
.pill.out{background:var(--bad-bg);color:var(--bad)} .pill.off{background:var(--line);color:var(--muted)}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;width:100%;text-align:left;min-height:64px}
.row .l{min-width:0}
.row .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.row.dim{opacity:.55}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:14px}

.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:15;background:var(--bg);padding:6px 0 8px}
.field{position:relative}
.field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.input,select.input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;font-size:1rem}
.field .input{padding-left:40px}
.input:focus{border-color:var(--primary);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface);border:1.5px solid var(--line);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns.two{grid-template-columns:repeat(2,1fr)}
.stack{display:flex;flex-direction:column;gap:8px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;border-radius:18px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 6px 18px rgba(16,32,58,.3)}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:.72rem;font-weight:600;color:var(--muted);min-height:58px;position:relative}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--primary)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:.66rem;padding:0 5px;min-width:17px;height:17px;line-height:17px;text-align:center;font-style:normal}

.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(6,12,24,.55)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mini div{background:var(--bg);border-radius:12px;padding:10px 12px}
.mini b{display:block;font-size:1.2rem;font-weight:800}
.mini span{font-size:.78rem;color:var(--muted)}
.lbl{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:.88rem;font-weight:600;min-height:1.2em;margin-top:8px}
.hist{margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hist li:last-child{border:0}
.hist .d{color:var(--muted);font-size:.78rem}
.plus{color:var(--ok);font-weight:800}.minus{color:var(--bad);font-weight:800}
.addr{background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:700;word-break:break-all;user-select:all}

.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;background:var(--bg)}
td.num,th.num{text-align:right}
tr:last-child td{border:0}
tfoot td{font-weight:800;background:var(--bg)}

details.grp{margin-bottom:8px}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:48px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary span{color:var(--muted);font-weight:500;font-size:.85rem}
.pl{padding:0 14px 6px}
.pl div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pl div.o{opacity:.5}
.cat-h{margin:20px 0 8px;font-size:1.25rem;font-weight:800;letter-spacing:-.02em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.92rem;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{padding:9px 4px;border-radius:9px;font-weight:600;font-size:.88rem;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}

.login{max-width:420px;margin:0 auto;padding:12vh 20px 40px}
.login h1{margin:16px 0 4px;font-size:2rem;font-weight:800;letter-spacing:-.03em}
.login .btn{margin-top:12px}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="login">
    <span class="tag big">Tindahan</span>
    <h1>Sign in</h1>
    <p class="muted" style="margin:0 0 6px">Use the username and password from the store owner.</p>
    <label class="lbl" for="lu">Username</label>
    <input class="input" id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="lbl" for="lp">Password</label>
    <input class="input" id="lp" type="password" autocomplete="current-password">
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn primary block" id="lbtn" data-act="login">Sign in</button>
  </div>
</div>

<div id="shell" hidden>
  <div class="app">
    <header class="top">
      <div><h1 id="title">Tindahan</h1><small id="sub"></small></div>
      <button class="who" id="who" data-act="account" aria-label="Account and settings"><span class="dot"></span><span id="whoTxt"></span></button>
    </header>
    <main id="main"></main>
  </div>
  <button class="fab" id="fab" data-act="addProduct" aria-label="Add product" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <nav class="nav" aria-label="Main"><div class="nav-in" id="nav"></div></nav>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" data-act="close"></div>
  <div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet"></div></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* ================= Server connection ================= */
let S = null;          // latest state from the store server
let online = true;
let lastSig = "";

async function api(action, body){
  let res;
  try{
    res = await fetch("/api/" + action, {
      method: body === undefined ? "GET" : "POST",
      headers: {"Content-Type":"application/json","X-Requested-With":"tindahan"},
      body: body === undefined ? undefined : JSON.stringify(body),
      credentials: "same-origin", cache: "no-store"
    });
  }catch(e){ throw {offline:true, message:"Can't reach the store server. Check your Wi-Fi."}; }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status === 401) throw {auth:true, message:(data && data.error) || "Please sign in."};
  if(!res.ok) throw {message:(data && data.error) || "Something went wrong. Try again."};
  return data;
}
function applyState(d){ S = d; lastSig = JSON.stringify(d); }

/* ================= Helpers ================= */
const $ = sel => document.querySelector(sel);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso = n => "₱" + Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fdate = iso => new Date(iso).toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"});
const ldate = iso => { const d = new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const byId = id => S.products.find(p => p.id === Number(id));
const isAdmin = () => S.user.role === "admin";
const byName = (a,b) => a.name.localeCompare(b.name);

// Search: every word must match, accents are ignored, and store slang works ("coke" finds Coca-Cola)
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const ALIASES = {coke:["coca-cola","coca cola"],kape:["coffee"],sabon:["soap"],bigas:["rice"],gatas:["milk"],suka:["vinegar"],toyo:["soy sauce"],sardinas:["sardines"],tinapay:["bread"],mantika:["cooking oil","oil"],asin:["salt"],asukal:["sugar"],itlog:["egg"]};
function matches(p, q){
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if(!toks.length) return true;
  const hay = norm([p.name,p.brand,p.category,p.sub,p.unit].join(" "));
  return toks.every(t => [t].concat(ALIASES[t]||[]).some(a => hay.includes(a)));
}
function statusOf(p){
  if(!p.active) return "off";
  if(p.stock <= 0) return "out";
  if(p.stock <= p.min) return "low";
  return "ok";
}
function stockPill(p){
  const st = statusOf(p);
  const txt = st==="off" ? "Inactive" : st==="out" ? "Out of stock" : st==="low" ? p.stock+" left · Low" : p.stock+" in stock";
  return `<span class="pill ${st}">${txt}</span>`;
}
function sub(p){ return [p.brand, p.category+" › "+p.sub, p.unit].filter(Boolean).join(" · "); }

let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2400);
}
const ICON = {
  home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  products:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  prices:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  stock:'<path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/>',
  reports:'<path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5M8 13h8M8 17h8"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

/* ================= UI state ================= */
const ui = { tab:"home", q:"", cat:"All", sub:"", stockTab:"low", rep:"products", from:"", to:"", pq:"" };
const TABS = [
  ["home","Home","Store overview"],
  ["products","Products","Search and manage items"],
  ["prices","Prices","Quick price list"],
  ["stock","Stock","Restock and movements"],
  ["reports","Reports","Lists and totals"]
];
function counts(){
  const a = S.products.filter(p => p.active);
  return {
    total:a.length,
    food:a.filter(p => p.category==="Food").length,
    non:a.filter(p => p.category!=="Food").length,
    low:a.filter(p => statusOf(p)==="low").length,
    out:a.filter(p => statusOf(p)==="out").length
  };
}

/* ================= Rendering ================= */
function renderChrome(){
  const meta = TABS.find(t => t[0]===ui.tab);
  $("#title").textContent = ui.tab==="home" ? "Tindahan Manager" : meta[1];
  const sm = $("#sub");
  sm.textContent = online ? meta[2] : "Can't reach the store server";
  sm.classList.toggle("offline", !online);
  $("#whoTxt").textContent = S.user.username;
  $("#who").classList.toggle("staff", !isAdmin());
  const c = counts();
  $("#nav").innerHTML = TABS.map(t => `<button data-act="tab" data-tab="${t[0]}" ${ui.tab===t[0]?'aria-current="page"':""}>${svg(t[0])}<span>${t[1]}</span>${t[0]==="stock" && (c.low+c.out)>0 ? `<i class="badge">${c.low+c.out}</i>`:""}</button>`).join("");
  $("#fab").hidden = !(ui.tab==="products" && isAdmin());
}
function render(){
  if(!S){ $("#shell").hidden = true; $("#login").hidden = false; return; }
  $("#login").hidden = true; $("#shell").hidden = false;
  renderChrome();
  ({home:viewHome,products:viewProducts,prices:viewPrices,stock:viewStock,reports:viewReports})[ui.tab]();
}
function softRender(){       // used by auto-refresh; keeps what you are typing
  if(!S) return render();
  renderChrome();
  if(ui.tab==="products") fillProducts();
  else if(ui.tab==="prices") fillPrices();
  else if(ui.tab==="reports") fillReport();
  else ({home:viewHome,stock:viewStock})[ui.tab]();
}

function rowBtn(p){
  return `<button class="card row ${p.active?"":"dim"}" data-act="open" data-id="${p.id}">
    <div class="l"><div class="n">${esc(p.name)}</div><div class="s">${esc(sub(p))}</div></div>
    <div class="r"><span class="tag">${peso(p.price)}</span>${stockPill(p)}</div></button>`;
}
function emptyBox(title, hint, btn=""){ return `<div class="card empty"><b>${esc(title)}</b>${esc(hint)}${btn}</div>`; }
const seedBtn = () => S.products.length===0 && isAdmin() ? `<div><button class="btn" data-act="seed">Load sample products</button></div>` : "";

/* ---- Home ---- */
function viewHome(){
  const c = counts();
  const restock = S.products.filter(p => ["low","out"].includes(statusOf(p))).sort((a,b) => a.stock-b.stock).slice(0,5);
  const recentPrice = [...S.priceHistory].sort((a,b) => b.date.localeCompare(a.date)).slice(0,4);
  const recentAdd = S.products.filter(p => p.active).sort((a,b) => b.added.localeCompare(a.added) || b.id-a.id).slice(0,3);
  $("#main").innerHTML = `
    ${S.user.mustChange ? `<div class="card notice"><span>You are using a temporary password.</span><button data-act="pwForm">Change it</button></div>` : ""}
    <div class="stats">
      <button class="card stat wide" data-act="tab" data-tab="products"><span>Products in your store</span><b>${c.total}</b></button>
      <div class="card stat"><b>${c.food}</b><span>Food</span></div>
      <div class="card stat"><b>${c.non}</b><span>Non-Food</span></div>
      <button class="card stat warn" data-act="stockTab" data-t="low"><b>${c.low}</b><span>Low stock</span></button>

/* ---- Products ---- */
function filtered(){
  return S.products.filter(p => {
    if(ui.cat==="Inactive"){ if(p.active) return false; }
    else if(!p.active) return false;
    if(S.cats[ui.cat]){ if(p.category!==ui.cat) return false; }
    if(ui.sub && p.sub!==ui.sub) return false;
    return matches(p, ui.q);
  }).sort(byName);
}
function subOptions(){
  if(!S.cats[ui.cat]) return "";
  return `<select class="input" id="subSel" aria-label="Subcategory" style="margin-top:8px"><option value="">All ${esc(ui.cat)}</option>${S.cats[ui.cat].map(s => `<option ${ui.sub===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`;
}
function viewProducts(){
  const chips = Object.keys(S.cats).length>2 ? ["All"].concat(Object.keys(S.cats)) : ["All","Food","Non-Food"];
  if(isAdmin()) chips.push("Inactive");
  $("#main").innerHTML = `
    <div class="search">
      <div class="field">${svg("search")}<input class="input" id="q" type="search" inputmode="search" placeholder="Search name, brand, category" value="${esc(ui.q)}" autocomplete="off"></div>
      <div class="chips" role="group" aria-label="Category">${chips.map(c => `<button class="chip" aria-pressed="${ui.cat===c}" data-act="cat" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div id="subWrap">${subOptions()}</div>
    </div>
    <div class="list" id="plist"></div>`;
  fillProducts();
}
function fillProducts(){
  const items = filtered();
  $("#plist").innerHTML = items.length ? items.map(rowBtn).join("") :
    emptyBox("No products found", S.products.length===0 ? (isAdmin() ? "Tap + to add your first product." : "Ask the owner to add products.") : "Try a shorter name or clear the filters.", seedBtn());
}

/* ---- Price list ---- */
function viewPrices(){
  $("#main").innerHTML = `<div class="search"><div class="field">${svg("search")}<input class="input" id="pq" type="search" placeholder="Check a price" value="${esc(ui.pq)}" autocomplete="off"></div></div><div id="plWrap"></div>`;
  fillPrices();
}
function fillPrices(){
  const items = S.products.filter(p => p.active && matches(p, ui.pq)).sort(byName);
  if(!items.length){ $("#plWrap").innerHTML = emptyBox("No matching price", S.products.length ? "Check the spelling or search by brand." : "No products yet."); return; }
  let out = "";
  Object.keys(S.cats).forEach(cat => {
    const inCat = items.filter(p => p.category===cat);
    if(!inCat.length) return;
    out += `<h2 class="cat-h">${esc(cat)}</h2>`;
    S.cats[cat].forEach(sc => {
      const g = inCat.filter(p => p.sub===sc);
      if(!g.length) return;
      out += `<details class="card grp" open><summary>${esc(sc)}<span>${g.length} item${g.length>1?"s":""}</span></summary><div class="pl">${g.map(p => `<div class="${p.stock<=0?"o":""}"><button data-act="open" data-id="${p.id}" style="text-align:left;flex:1;min-width:0"><span style="font-weight:600">${esc(p.name)}</span>${p.stock<=0?'<span class="pill out" style="margin-left:6px">Out</span>':""}</button><span class="tag">${peso(p.price)}</span></div>`).join("")}</div></details>`;
    });
  });
  $("#plWrap").innerHTML = out;
}

/* ---- Stock ---- */
function moveLabel(t){ return t==="in" ? "Stock in" : t==="out" ? "Stock out" : "Adjustment"; }
function signOf(m){ return m.type==="in" ? "+"+m.qty : m.type==="out" ? "−"+m.qty : (m.qty>=0?"+":"−")+Math.abs(m.qty); }
function viewStock(){
  const seg = [["low","Low"],["out","Out"],["history","History"]];
  let body = "";
  if(ui.stockTab==="history"){
    const mv = [...S.movements].sort((a,b) => b.date.localeCompare(a.date) || b.id-a.id).slice(0,60);
    body = mv.length ? `<div class="card" style="padding:4px 14px"><ul class="hist">${mv.map(m => { const p = byId(m.pid); if(!p) return ""; const sg = signOf(m);
      return `<li><div><b>${esc(p.name)}</b><div class="d">${fdate(m.date)} · ${moveLabel(m.type)}${m.note?" · "+esc(m.note):""} · by ${esc(m.by)}</div></div><div style="text-align:right"><span class="${sg.startsWith("+")?"plus":"minus"}">${sg}</span><div class="d">now ${m.after}</div></div></li>`; }).join("")}</ul></div>` : emptyBox("No stock movements yet","Open a product and tap Stock in or Stock out.");
  } else {
    const items = S.products.filter(p => statusOf(p)===ui.stockTab).sort((a,b) => a.stock-b.stock || byName(a,b));
    body = items.length ? `<div class="list">${items.map(p => `<button class="card row" data-act="open" data-id="${p.id}"><div class="l"><div class="n">${esc(p.name)}</div><div class="s">Minimum ${p.min} ${esc(p.unit.toLowerCase())}</div></div><div class="r">${stockPill(p)}</div></button>`).join("")}</div>` :
      emptyBox(ui.stockTab==="low"?"No low-stock items":"Nothing is out of stock", "Products will show here when they reach their minimum.");
  }
  $("#main").innerHTML = `<div class="seg" role="group" aria-label="Stock view">${seg.map(s => `<button data-act="stockTab" data-t="${s[0]}" aria-pressed="${ui.stockTab===s[0]}">${s[1]}</button>`).join("")}</div>${body}`;
}

/* ---- Reports ---- */
function reportData(){
  const act = S.products.filter(p => p.active).sort(byName);
  if(ui.rep==="products") return {cols:["Product","Category","Unit","Price","Stock"],num:[3,4],
    rows:act.map(p => [p.name,p.category+" › "+p.sub,p.unit,peso(p.price),p.stock])};
  if(ui.rep==="low") return {cols:["Product","Stock","Minimum"],num:[1,2],
    rows:act.filter(p => ["low","out"].includes(statusOf(p))).sort((a,b) => a.stock-b.stock).map(p => [p.name,p.stock,p.min])};
  if(ui.rep==="prices"){
    const rows = S.priceHistory.filter(h => (!ui.from || ldate(h.date)>=ui.from) && (!ui.to || ldate(h.date)<=ui.to))
      .sort((a,b) => b.date.localeCompare(a.date)).map(h => { const p = byId(h.pid); return p ? [fdate(h.date),p.name,peso(h.prev),peso(h.next),h.reason] : null; }).filter(Boolean);
    return {cols:["Date","Product","Previous","New","Reason"],num:[2,3],rows};
  }
  const rows = act.map(p => [p.name,p.stock,peso(p.cost),peso(p.stock*p.cost)]);
  const total = act.reduce((s,p) => s+p.stock*p.cost,0);
  return {cols:["Product","Stock","Cost","Est. value"],num:[1,2,3],rows,foot:["Total","","",peso(total)]};
}
function viewReports(){
  const R = [["products","Products"],["low","Low stock"]].concat(isAdmin() ? [["prices","Price changes"],["inventory","Inventory"]] : []);
  if(!R.some(r => r[0]===ui.rep)) ui.rep = "products";
  if(ui.rep==="prices" && !ui.from){ const d = new Date(); d.setDate(d.getDate()-30); ui.from = ldate(d.toISOString()); ui.to = ldate(new Date().toISOString()); }
  $("#main").innerHTML = `
    <div class="chips" role="group" aria-label="Report">${R.map(r => `<button class="chip" aria-pressed="${ui.rep===r[0]}" data-act="repTab" data-r="${r[0]}">${r[1]}</button>`).join("")}</div>
    ${ui.rep==="prices" ? `<div class="two-col" style="margin-top:10px"><div><label class="lbl" style="margin-top:0" for="from">From</label><input class="input" id="from" type="date" value="${ui.from}"></div><div><label class="lbl" style="margin-top:0" for="to">To</label><input class="input" id="to" type="date" value="${ui.to}"></div></div>`:""}
    <div id="repBody" style="margin-top:12px"></div>`;
  fillReport();
}
function fillReport(){
  const d = reportData();
  $("#repBody").innerHTML = d.rows.length ? `<div class="tbl-wrap"><table><thead><tr>${d.cols.map((c,i) => `<th class="${d.num.includes(i)?"num":""}">${c}</th>`).join("")}</tr></thead><tbody>${d.rows.map(r => `<tr>${r.map((v,i) => `<td class="${d.num.includes(i)?"num":""}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody>${d.foot?`<tfoot><tr>${d.foot.map((v,i) => `<td class="${d.num.includes(i)?"num":""}">${esc(v)}</td>`).join("")}</tr></tfoot>`:""}</table></div>
    <button class="btn block" style="margin-top:12px" data-act="copyCsv">Copy report as CSV</button>` : emptyBox("Nothing to show","No records match this report.");
}

    <label class="lbl" for="c_name">Subcategory name</label><input class="input" id="c_name" maxlength="40" placeholder="e.g. Ice Candy">
    <div class="err" id="err" role="alert"></div>
    <div class="btns two" style="margin-top:10px"><button class="btn" data-act="account">Back</button><button class="btn primary" data-act="saveCat">Add category</button></div>`);
}

/* ================= Actions ================= */
function csvOf(d){
  const q = v => '"'+String(v).replace(/"/g,'""')+'"';
  return [d.cols].concat(d.rows).concat(d.foot?[d.foot]:[]).map(r => r.map(q).join(",")).join("\n");
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const a = document.createElement("textarea"); a.value = t; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); const ok = document.execCommand("copy"); a.remove(); return ok; }catch(e){ return false; }
}

function handleFail(e){
  if(e.auth){ S = null; closeSheet(); render(); $("#lerr").textContent = "Your session ended. Sign in again."; return; }
  if(e.offline) { online = false; if(S) renderChrome(); }
  if(!$("#sheetWrap").hidden) setErr(e.message); else toast(e.message);
}
// Send a change to the server, then show the fresh shared data
async function mutate(el, action, body, msg, before, reopen){
  if(el) el.disabled = true;
  try{
    const d = await api(action, body);
    online = true; applyState(d);
    if(before) before();
    closeSheet(); render(); if(reopen) reopen(); toast(msg);
  }catch(e){ if(el) el.disabled = false; handleFail(e); }
}

const ACT = {
  tab(el){ ui.tab = el.dataset.tab; render(); window.scrollTo(0,0); },
  stockTab(el){ ui.tab = "stock"; ui.stockTab = el.dataset.t; render(); window.scrollTo(0,0); },
  repTab(el){ ui.tab = "reports"; ui.rep = el.dataset.r; render(); window.scrollTo(0,0); },
  cat(el){ ui.cat = el.dataset.c; ui.sub = ""; viewProducts(); },
  open(el){ sheetProduct(el.dataset.id); },
  close(){ closeSheet(); },
  account(){ sheetAccount(); },
  pwForm(){ sheetPw(); },
  usersSheet(){ sheetUsers(); },
  resetForm(el){ sheetReset(el.dataset.id, el.dataset.name); },
  addProduct(){ if(isAdmin()) sheetProductForm(null); },
  editForm(el){ sheetProductForm(el.dataset.id); },
  priceForm(el){ sheetPrice(el.dataset.id); },
  stockForm(el){ sheetStock(el.dataset.id, el.dataset.type); },
  catForm(){ sheetCat(); },

  async login(el){
    const username = val("lu").trim(), password = val("lp");
    $("#lerr").textContent = "";
    if(!username || !password){ $("#lerr").textContent = "Enter your username and password."; return; }
    el.disabled = true;
    try{
      const d = await api("login", {username, password});
      applyState(d); online = true; $("#lp").value = ""; ui.tab = "home"; ui.cat = "All";
      render();
      if(S.user.mustChange) sheetPw();
    }catch(e){ $("#lerr").textContent = e.message; }
    el.disabled = false;
  },
  async logout(){
    try{ await api("logout", {}); }catch(e){}
    S = null; closeSheet(); render();
  },

  saveStock(el){
    const type = el.dataset.type, q = Number(val("qty"));
    if(val("qty")==="" || !Number.isInteger(q) || q < 0 || (type!=="adjust" && q===0)) return setErr(type==="adjust" ? "Enter the actual count." : "Enter a quantity of 1 or more.");
    mutate(el, "stock", {pid:Number(el.dataset.id), type, qty:q, note:val("note")}, type==="in"?"Stock in saved":type==="out"?"Stock out saved":"Adjustment saved");
  },
  savePrice(el){
    if(val("np")==="") return setErr("Enter the new price.");
    mutate(el, "price", {pid:Number(el.dataset.id), price:Number(val("np")), reason:val("rs")}, "Price saved");
  },
  saveProduct(el){
    const id = el.dataset.id;
    const body = {name:val("f_name"), brand:val("f_brand"), category:val("f_cat"), sub:val("f_sub"), unit:val("f_unit"), cost:val("f_cost"), min:val("f_min")};
    if(!body.name.trim()) return setErr("Enter the product name.");
    if(id) body.id = Number(id); else { body.price = val("f_price"); body.stock = val("f_stock"); }
    mutate(el, "product", body, id ? "Changes saved" : "Product added", id ? null : () => { ui.tab = "products"; ui.q = ""; ui.cat = "All"; ui.sub = ""; });
  },
  toggleActive(el){
    const p = byId(el.dataset.id);
    mutate(el, "product/active", {id:p.id, active:!p.active}, p.active ? "Product deactivated" : "Product reactivated");
  },
  savePw(el){
    if(val("pw1") !== val("pw2")) return setErr("The new passwords do not match.");
    mutate(el, "password", {current:val("pw0"), next:val("pw1")}, "Password changed");
  },
  addUser(el){
    mutate(el, "users/add", {username:val("u_name"), password:val("u_pw"), role:val("u_role")}, "User added", null, sheetUsers);
  },
  saveReset(el){
    mutate(el, "users/reset", {id:Number(el.dataset.id), password:val("r_pw")}, "Password reset", null, sheetUsers);
  },
  delUser(el){
    if(!confirm("Delete user " + el.dataset.name + "?")) return;
    mutate(el, "users/delete", {id:Number(el.dataset.id)}, "User deleted", null, sheetUsers);
  },
  saveCat(el){
    let group = val("c_parent");
    if(group==="__new") group = val("c_group");
    mutate(el, "category", {group, name:val("c_name")}, "Category added");
  },
  seed(el){ mutate(el, "seed", {}, "Sample products loaded"); },
  async copyCsv(){ toast(await copyText(csvOf(reportData())) ? "Report copied" : "Could not copy. Select the table text instead."); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(fn) fn(el);
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if(id==="q"){ ui.q = e.target.value; fillProducts(); }
  else if(id==="pq"){ ui.pq = e.target.value; fillPrices(); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if(id==="subSel"){ ui.sub = e.target.value; fillProducts(); }
  else if(id==="f_cat"){ $("#f_sub").innerHTML = subOpts(e.target.value,""); }
  else if(id==="c_parent"){ $("#newGroup").hidden = e.target.value !== "__new"; }
  else if(id==="from"){ ui.from = e.target.value; fillReport(); }
  else if(id==="to"){ ui.to = e.target.value; fillReport(); }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && !$("#sheetWrap").hidden) closeSheet();
  if(e.key==="Enter" && (e.target.id==="lu" || e.target.id==="lp")) $("#lbtn").click();
});

/* ================= Live refresh: see changes made on other phones ================= */
async function refresh(){
  if(!S || document.hidden || !$("#sheetWrap").hidden) return;
  try{
    const d = await api("state");
    const wasOffline = !online; online = true;
    const sig = JSON.stringify(d);
    if(sig !== lastSig){ applyState(d); softRender(); }
    else if(wasOffline) renderChrome();
  }catch(e){
    if(e.auth){ S = null; render(); $("#lerr").textContent = "Your session ended. Sign in again."; }
    else if(e.offline && online){ online = false; renderChrome(); }
  }
}
setInterval(refresh, 10000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
window.addEventListener("online", refresh);

/* ================= Start ================= */
(async function boot(){
  try{ applyState(await api("state")); }
  catch(e){ S = null; if(e.offline) $("#lerr").textContent = e.message; }
  render();
  if(S && S.user.mustChange) sheetPw();
})();
</script>
</body>
